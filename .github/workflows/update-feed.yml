name: Update Merchant Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Merchant Center feed
        run: python scraper_v4.py

      - name: Commit updated feed
        run: |
          git config user.name "banyaline-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add merchant.xml
          git diff --cached --quiet && exit 0
          git commit -m "Update Merchant Center feed"
          git push
